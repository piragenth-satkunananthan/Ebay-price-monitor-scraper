version: '3.8'

services:
  frontend:
    build: .
    container_name: ebay_frontend
    # Runs the Streamlit dashboard on port 8501
    command: uv run --python 3.12 streamlit run main.py --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      # Maps the local ./data folder to the container so the database persists
      - .:/app
    restart: unless-stopped
#    logging:
#      driver: "json-file"
#      options:
#        max-size: "10m"
#        max-file: "3"

  scraper:
    build: .
    container_name: ebay_scraper_worker
    command: uv run --python 3.12 run_scraper.py
    volumes:
      - .:/app
    restart: unless-stopped
#    logging:
#      driver: "json-file"
#      options:
#        max-size: "10m"
#        max-file: "3"
